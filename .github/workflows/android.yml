name: Android APK

# Builds the Android app (app/android): the web app is copied into the APK, so it works offline and can pick files,
# save to Downloads and show the home-screen widget. The APK is signed with the personal key: fine for installing by hand.
# Download it from the run's "Artifacts" section (transly-apk). It runs by hand only (not on every push); the phone code is still checked by the "Tests" workflow.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish the APK as the "android-latest" release (a direct download link)'
        type: boolean
        default: false

# The build job runs third-party code (npm, gradle): it gets a read-only token. Only the release job can write.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test and build the phone app
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build:mobile

      - name: Put the web app into the APK
        working-directory: app/android
        run: |
          mkdir -p app/src/main/assets
          cp -r ../dist-mobile/. app/src/main/assets/

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Fixed signing key (secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -z "$PW" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is missing or empty (the name must match exactly)."
            exit 1
          fi
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/transly.keystore"
            echo "TRANSLY_KEYSTORE=$RUNNER_TEMP/transly.keystore" >> "$GITHUB_ENV"
            echo fixed > signing.txt
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: the APK gets a throw-away debug key and cannot update over an installed build."
            echo debug > signing.txt
          fi

      - name: Build the APK
        working-directory: app/android
        env:
          TRANSLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect the APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk transly.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transly-apk
          path: |
            transly.apk
            signing.txt
          if-no-files-found: error

  release:
    needs: apk
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: transly-apk
          path: out
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          # nothing is deleted before it is certain that the new release can be made
          test -s out/transly.apk || { echo "::error::No APK to publish"; exit 1; }
          if [ "$(cat out/signing.txt 2>/dev/null)" = fixed ]; then
            SIGNED="signed with the fixed key of this project: it installs over the previous build."
          else
            SIGNED="signed with a throw-away debug key (the ANDROID_KEYSTORE_B64 secret is missing): it cannot be installed over an earlier build."
          fi
          # The new release is made complete under a temporary tag first (the upload is the slow part), and only then does the channel tag move to it.
          TMP="android-build-$GITHUB_RUN_ID"
          gh release create "$TMP" out/transly.apk --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Transly for Android" \
            --notes "Build of commit $GITHUB_SHA, $SIGNED Install by hand: allow installs from your browser or file manager."
          gh release delete android-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release edit "$TMP" --tag android-latest --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
