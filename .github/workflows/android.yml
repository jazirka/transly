name: Android APK

# Builds the Android app (app/android): the web app is copied into the APK, so it works offline and can pick files,
# save to Downloads and show the home-screen widget. The APK is signed with the personal key: fine for installing by hand.
# Download it from the run's "Artifacts" section (transly-apk).

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish the APK as the "android-latest" release (a direct download link)'
        type: boolean
        default: false
  push:
    branches: [ccr-a0ee6fc6-t2at3x]
    paths:
      - 'app/android/**'
      - 'app/src/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write # only used to publish the release below

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test and build the phone app
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build:mobile

      - name: Put the web app into the APK
        working-directory: app/android
        run: |
          mkdir -p app/src/main/assets
          cp -r ../dist-mobile/. app/src/main/assets/

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Fixed signing key (secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/transly.keystore"
            echo "TRANSLY_KEYSTORE=$RUNNER_TEMP/transly.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: the APK gets a throw-away debug key and cannot update over an installed build."
          fi

      - name: Build the APK
        working-directory: app/android
        env:
          TRANSLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect the APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk transly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: transly-apk
          path: transly.apk
          if-no-files-found: error

      - name: Publish as a release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest transly.apk --prerelease --target "$GITHUB_SHA" \
            --title "Transly for Android" \
            --notes "Build of commit $GITHUB_SHA, signed with the debug key. Install by hand: allow installs from your browser or file manager."
