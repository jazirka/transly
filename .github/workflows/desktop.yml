name: Desktop app

# Builds the Tauri desktop app (app/src-tauri) for Windows only. It adds what a browser cannot do: remembers
# the game folder, writes the translation into the game, starts the game (also inside a chosen scene).
# The tests (types, unit tests, browser scenarios) run on every push in the "Tests" workflow, so they are not run again here.
# Run it by hand from the Actions tab; tick "release" to publish the installers as the "desktop-latest" release.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the installers as the "desktop-latest" release (a direct download link)'
        type: boolean
        default: false

# The build job reads the repository and runs third-party code (npm, cargo build scripts): it gets a read-only token.
# Only the release job, which runs no project code, can write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri

      - name: Build the installer
        working-directory: app
        shell: bash
        env:
          # the installer takes updates only from this repository (see allowed_update in src-tauri/src/lib.rs)
          TRANSLY_UPDATE_REPO: ${{ github.repository }}
        run: |
          npm ci
          npm run tauri build

      - name: Collect the installers
        shell: bash
        run: |
          mkdir out
          find app/src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transly-desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: ${{ needs.build.result == 'success' && inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: transly-desktop-*
          merge-multiple: true
          path: out
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          # nothing is deleted before it is certain that the new release can be made
          ls out/*.exe >/dev/null 2>&1 || { echo "::error::No installer to publish"; exit 1; }
          # The new release is made complete under a temporary tag first (the upload is the slow part), and only then does the channel tag move to it:
          # the channel is without a release for the length of two quick calls, not for the length of an upload.
          TMP="desktop-build-$GITHUB_RUN_ID"
          gh release create "$TMP" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Transly for desktop" \
            --notes "Build of commit $GITHUB_SHA. Windows: the .exe (installer) or .msi."
          gh release delete desktop-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release edit "$TMP" --tag desktop-latest --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
