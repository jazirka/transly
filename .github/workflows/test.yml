name: Tests

# Checks every push: types, unit tests, and the browser scenarios in app/test-ui (real Chromium against the built apps).
# The installers are built by "Desktop app" and "Android APK", which run by hand; this one needs no secrets and writes nothing.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Types
        working-directory: app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: Browser scenarios
        working-directory: app
        run: |
          npm i --no-save --no-package-lock playwright@1.63
          npx playwright install --with-deps chromium
          npm run test:ui
