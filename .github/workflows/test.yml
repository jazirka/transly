name: Tests

# Checks every push: types, unit tests, and the browser scenarios in app/test-ui (real Chromium against the built apps).
# The installers are built by "Desktop app" and "Android APK", which run by hand; this one needs no secrets and writes nothing.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Types
        working-directory: app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: Browser scenarios
        working-directory: app
        run: |
          # Playwright is not a dependency of the project: it lives outside it (the scenarios find it through NODE_PATH)
          npm i --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" npm run test:ui
