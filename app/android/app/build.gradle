plugins {
    id 'com.android.application'
}

android {
    namespace 'app.transly'
    compileSdk 34

    defaultConfig {
        applicationId 'app.transly'
        minSdk 29          // Android 10: MediaStore downloads without storage permissions
        targetSdk 34
        // Every CI run is newer than the one before: Android only updates an installed app with a higher or equal version code.
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
        versionName '1.0'
    }

    signingConfigs {
        // One fixed key for every build, given by the CI secrets. With the debug key of the CI runner (new on each run)
        // the phone refuses to install a build over the previous one ("App not installed").
        personal {
            def file = System.getenv('TRANSLY_KEYSTORE')
            if (file) {
                storeFile file(file)
                storePassword System.getenv('TRANSLY_KEYSTORE_PASSWORD')
                keyAlias 'transly'
                keyPassword System.getenv('TRANSLY_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // The fixed key when the CI provides it, otherwise the debug key (a local build).
            signingConfig System.getenv('TRANSLY_KEYSTORE') ? signingConfigs.personal : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
