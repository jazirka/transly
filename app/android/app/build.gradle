plugins {
    id 'com.android.application'
}

android {
    namespace 'app.transly'
    compileSdk 34

    defaultConfig {
        applicationId 'app.transly'
        minSdk 29          // Android 10: MediaStore downloads without storage permissions
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // A personal build: signed with the debug key so it installs by hand. Publish with your own key instead.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
