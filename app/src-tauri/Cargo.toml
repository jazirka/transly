[package]
name = "transly"
version = "0.1.0"
description = "Transly: game translation workspace"
edition = "2021"
rust-version = "1.77"

[lib]
name = "transly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
