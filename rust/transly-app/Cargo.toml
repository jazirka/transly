[package]
name = "transly-app"
version = "0.0.1"
edition = "2021"
description = "Нативний інтерфейс Transly на egui (етап 3): каркас — відкрити гру, переглянути рядки, редагувати переклад, зберегти проєкт"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
rfd = "0.16"
transly-core = { path = "../transly-core" }
transly-platform = { path = "../transly-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
indexmap = { version = "2", features = ["serde"] }

# токен GitHub лежить у сховищі облікових даних Windows (переживає оновлення програми)
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["wgpu", "snapshot"] }
