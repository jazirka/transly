[package]
name = "transly-app"
version = "0.0.1"
edition = "2021"
description = "Нативний інтерфейс Transly на egui (етап 3): каркас — відкрити гру, переглянути рядки, редагувати переклад, зберегти проєкт"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
rfd = "0.16"
transly-core = { path = "../transly-core" }
transly-platform = { path = "../transly-platform" }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
egui_kittest = "0.31"
