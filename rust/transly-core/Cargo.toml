[package]
name = "transly-core"
version = "0.1.0"
edition = "2021"
description = "Ядро Transly: чиста логіка без інтерфейсу (переклад app/src/core)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
