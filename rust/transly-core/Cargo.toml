[package]
name = "transly-core"
version = "0.1.0"
edition = "2021"
description = "Ядро Transly: чиста логіка без інтерфейсу (переклад app/src/core)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
aho-corasick = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
icu_collator = "2"
icu_locale = "2"
url = "2"
sha2 = "0.10"
flate2 = "1"
crc32fast = "1"
sha1 = "0.10"
