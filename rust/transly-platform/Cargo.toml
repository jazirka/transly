[package]
name = "transly-platform"
version = "0.1.0"
edition = "2021"
description = "Платформа Transly: безпечний доступ до файлів гри, збірка, запуск, оновлення (перенесено з app/src-tauri, без Tauri)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
